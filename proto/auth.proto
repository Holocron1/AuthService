syntax = "proto3";

package auth;

option go_package = "github.com/Holocron1/authservice/pkg/authpb";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string jwt_token = 1;
}

message VerifyRequest {
    string jwt_token = 1;
}

message VerifyResponse {
  string jwt_token = 1;
}