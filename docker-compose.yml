services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: firstUser
      POSTGRES_PASSWORD: userPass
      POSTGRES_DB: firstDatabase
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U firstUser -d firstDatabase" ]
      interval: 5s
      timeout: 5s
      retries: 5
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://firstUser:userPass@postgres:5432/firstDatabase?sslmode=disable"
      JWT_SECRET: "random-text-123"
      JWT_TTL: "60m"
      HTTP_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy